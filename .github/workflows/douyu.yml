# 斗鱼原画源定时刷新（GitHub Actions 版）
#
# 放到一个【新建的】仓库里，路径：.github/workflows/douyu.yml
# 同仓库根目录放 douyu_refresh.py。
#
# 为什么必须新建仓库？——因为你现有的 ch1026/iptv-api 用 artifact 方式部署 Pages，
# 一个仓库只能有一个 Pages 站点。如果在这个仓库里再加一条部署，两个工作流会互相
# 覆盖整个站点，result.m3u 会时好时坏。
#
# 跑起来后：
#   完整合并版（**推荐直接用它替代主订阅**，斗鱼时效由本任务保证）：
#     https://<你的用户名>.github.io/<本仓库名>/full.m3u
#   仅斗鱼频道：
#     https://<你的用户名>.github.io/<本仓库名>/douyu.m3u
#
# ---------------------------------------------------------------------------
# 三个可选设置（都在仓库 Settings → Secrets and variables → Actions 里加）
#
#   Variables（普通变量）DOUYU_WORKER_BASE
#       填你部署好的中转服务地址，例如 https://douyu.xxx.workers.dev
#       填了之后输出的线路会走中转服务，每次请求都重新签发新直链 ——
#       这是唯一能彻底解决「直链一次性、播放器测速后播放失败」的办法。
#       不填（或删掉）则退回直链模式，行为与现在完全一样。
#       中转服务代码见同目录 douyu-worker.js。
#
#   Secrets（加密）DOUYU_COOKIE
#       填你自己的斗鱼登录 Cookie。带上后，多档位房间有机会拿到真原画；
#       不带的话斗鱼会把多档位房间降级成 _4000 转码流（一起看类房间更会压到 _550。
#       注意：Cookie 等同账号凭证，只放在自己仓库里，别外传。
#
#   Variables DOUYU_EXTRA_ROOMS
#       额外收录的房间（主仓库因画质门槛过滤掉的），格式 "房间号=频道名,房间号=频道名"
#       留空则使用下面的默认值。
#
#   Variables DOUYU_RELAY_ROOMS
#       需要走【流式中继 + 时间戳归一化】的房间号，逗号分隔。
#       斗鱼部分转码流的 AVC 配置帧带着过期时间基准（实测 蓝翔新三国 rid=5908256
#       的配置帧 ts=16690、首个图像帧 ts=327583370，相差 91 小时），
#       播放器时间轴会崩 —— 表现是「频道加载得出来但就是播不出」。
#       这些房间必须走 /r/ 中继，中转服务会把时间戳重排成 0/40/80… 才能起播。
#       脚本每轮都会自动探测并打印全量列表中哪些房间有此问题，照着填即可。
#       仅在配置了 DOUYU_WORKER_BASE 时生效。
# ---------------------------------------------------------------------------

name: douyu-m3u

on:
  schedule:
    # 每 10 分钟。GitHub 的 cron 最小粒度是 5 分钟；实际可能有几分钟延迟。
    # 斗鱼直链寿命约 20~30 分钟，10 分钟一轮有约 2.5 倍余量。
    # 想更保险可改成 '*/5 * * * *'（限流风险略增）。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: douyu-m3u
  cancel-in-progress: false

env:
  # 主订阅源。换成你自己的也行。
  SRC_M3U: https://ch1026.github.io/iptv-api/result.m3u
  # 额外收录的房间：这些在主仓库里因为实测画质低于门槛被过滤掉了，这里手动加回。
  # 「一起看」类房间斗鱼侧本来就只给 550kbps（蓝翔新三国实测 640x360），
  # 嫌画质低把这几个删掉即可。
  EXTRA_ROOMS: ${{ vars.DOUYU_EXTRA_ROOMS || '5908256=蓝翔新三国,7459925=蓝翔老三国,12253936=新三国(颜老师)' }}
  # 走流式中继 + 时间戳归一化的房间。见文件头 DOUYU_RELAY_ROOMS 说明。
  RELAY_ROOMS: ${{ vars.DOUYU_RELAY_ROOMS || '5908256' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 成功率低于 30% 时脚本返回退出码 2，本步骤失败 -> 后续步骤不执行 ->
      # 线上保留上一次的好结果，不会被空文件覆盖。
      #
      # --merge 产出【完整合并版】full.m3u：主结果里的非斗鱼线路原样保留、
      # 斗鱼线路换成原画直链，同时保留上游转流线作为备用。
      # 它可以直接替代主订阅地址，主仓库无需做任何改动、也不用配白名单。
      #
      # DOUYU_WORKER_BASE 未配置时为空串，脚本会自动退回「直链模式」。
      - name: 生成斗鱼原画源
        env:
          DOUYU_COOKIE: ${{ secrets.DOUYU_COOKIE }}
        run: |
          python douyu_refresh.py \
            --src "$SRC_M3U" \
            --out  public/douyu.m3u \
            --merge public/full.m3u \
            --local public/douyu-local.txt \
            --report public/douyu-report.csv \
            --extra-rooms "$EXTRA_ROOMS" \
            --worker-base "${{ vars.DOUYU_WORKER_BASE }}" \
            --relay-rooms "$RELAY_ROOMS" \
            --cookie "$DOUYU_COOKIE"

      - name: 生成索引页
        run: |
          cat > public/index.html <<'HTMLEOF'
          <!doctype html><meta charset="utf-8">
          <title>斗鱼原画源</title>
          <style>body{font:15px/1.9 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}
          code{background:#f4f4f4;padding:2px 6px;border-radius:4px}h3{margin-bottom:4px}
          .warn{background:#fff8e1;border-left:4px solid #f0ad4e;padding:10px 14px;border-radius:4px}</style>
          <h2>斗鱼原画源</h2>
          <p>由 GitHub Actions 每 10 分钟自动刷新。直链带签名，约 20~30 分钟过期，请勿手动另存。</p>
          <div class="warn">
            <b>两个坑都记一下：</b><br>
            ① <b>斗鱼直链是「一次性授权」</b>——同一条地址只有第一条连接能长跑，后续连接会被
            服务端在 0.3~0.6 秒内掐断。播放器若先测速再播放、或播放中断线重连，就会失败
            （表现为「播一两秒就报失败」）。<br>
            ② <b>部分转码流时间戳损坏</b>——斗鱼「一起看」类房间的 AVC 配置帧带着过期时间基准
            （实测与首个图像帧相差 91 小时），播放器时间轴崩溃，表现为「频道加载得出来但播不出」。<br>
            两者都靠部署中转服务（<code>douyu-worker.js</code>）解决：前者用 <code>/d/</code> 每次
            重新签发直链，后者用 <code>/r/</code> 顺带做时间戳归一化。在仓库变量里设置
            <code>DOUYU_WORKER_BASE</code> 即可启用。
          </div>
          <h3>推荐：完整合并版</h3>
          <p><code>full.m3u</code> —— 主结果的全部频道 + 斗鱼线路已换成原画直链，
          并保留上游转流线作为备用。可直接替代原来的主订阅地址。</p>
          <h3>其它文件</h3>
          <ul>
            <li><code>douyu.m3u</code> —— 只含斗鱼频道，适合与原订阅并行使用</li>
            <li><code>douyu-local.txt</code> —— iptv-api 本地源格式（频道名,直链）</li>
            <li><code>douyu-report.csv</code> —— 全部房间的实测报告（含真实分辨率、是否转码）</li>
          </ul>
          HTMLEOF

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
